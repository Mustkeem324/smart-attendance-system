<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D72FF" />
      <stop offset="50%" stop-color="#602BF7" />
      <stop offset="100%" stop-color="#4818D9" />
    </linearGradient>
    <linearGradient id="logoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8055F7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Squircle + SE Curve) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0C102C" stroke="#7544F8" stroke-width="2.5" />
    <!-- Ambient Glow -->
    <circle cx="50" cy="50" r="30" fill="#602BF7" opacity="0.3" filter="url(#logoGlow)" />
    <!-- S-E Path -->
    <path d="M 32 36 C 32 28, 42 24, 52 24 C 65 24, 74 29, 76 38 C 77 42, 74 45, 69 45 L 46 45 C 40 45, 36 48, 36 53 C 36 57, 40 61, 46 61 L 67 61 C 72 61, 75 64, 75 69 C 75 77, 66 81, 52 81 C 38 81, 28 75, 27 66 C 26 62, 29 59, 33 59 L 56 59 C 62 59, 65 56, 65 52 C 65 48, 62 45, 56 45 L 39 45 C 34 45, 32 41, 32 36 Z" 
          fill="url(#logoPrimary)" />
    <!-- Cyan Cyber Points -->
    <circle cx="32" cy="36" r="3.5" fill="#00E5FF" />
    <circle cx="68" cy="80" r="3.5" fill="#00E5FF" />
    <circle cx="50" cy="52" r="3" fill="#FFFFFF" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(130, 0)">
    <!-- Brand Name -->
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.02em" fill="#FFFFFF">
      SALMAN
    </text>
    <text x="146" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.02em" fill="url(#logoAccent)">
      ENTERPRISES
    </text>

    <!-- Subtitle Badge / Tagline -->
    <text x="2" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="0.25em" fill="#A78BFA">
      B2B DISTRIBUTION &amp; FIELD LOGISTICS
    </text>
  </g>
</svg>
