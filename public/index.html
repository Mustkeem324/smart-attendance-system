<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>APEX Electronics — Mobile Enterprise</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0E122A" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0E122A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
    }
    .logo-container svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #A5B4FC;
      max-width: 280px;
      line-height: 1.4;
      margin-bottom: 28px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(165, 180, 252, 0.2);
      border-top-color: #8B5CF6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>APEX ELECTRONICS</h1>
  <p>Loading Enterprise Distribution &amp; Field Sales Suite...</p>
  <div class="spinner"></div>

  <script>
    // Intelligent mobile bootloader
    (function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
      var target = isMobile ? '/field-sales/mobile' : '/distribution';
      setTimeout(function() {
        window.location.replace(target);
      }, 300);
    })();
  </script>
</body>
</html>
