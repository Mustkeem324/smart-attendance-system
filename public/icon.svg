<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E122A" />
      <stop offset="50%" stop-color="#14183E" />
      <stop offset="100%" stop-color="#07091B" />
    </linearGradient>

    <!-- Vibrant Purple-Indigo Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8055F7" />
      <stop offset="50%" stop-color="#602BF7" />
      <stop offset="100%" stop-color="#4818D9" />
    </linearGradient>

    <!-- Cyan-Violet Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>

    <!-- Gold-Bronze Wholesale Shield Stroke -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D72FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5428E8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="8" />

  <!-- Inner Ambient Glow Sphere -->
  <circle cx="256" cy="256" r="140" fill="#602BF7" opacity="0.25" filter="url(#glow)" />

  <!-- Dynamic Geometric Emblem: Interlocking 'S' & 'E' Wings -->
  <!-- Top Arch of 'S' flowing into 'E' upper shelf -->
  <path d="M 160 176 C 160 136, 208 116, 266 116 C 330 116, 376 142, 384 186 C 388 206, 372 222, 350 222 L 230 222 C 200 222, 184 238, 184 260 C 184 282, 202 298, 234 298 L 340 298 C 362 298, 380 316, 380 338 C 380 378, 332 400, 260 400 C 190 400, 142 370, 136 324 C 134 306, 148 292, 168 292 L 284 292 C 314 292, 330 276, 330 256 C 330 236, 312 220, 282 220 L 194 220 C 172 220, 160 202, 160 176 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#glow)" />

  <!-- High-Precision Cyber Nodes & Connectivity Beams -->
  <circle cx="160" cy="176" r="16" fill="#00E5FF" />
  <circle cx="350" cy="222" r="14" fill="#C77DFF" />
  <circle cx="168" cy="292" r="14" fill="#C77DFF" />
  <circle cx="340" cy="396" r="16" fill="#00E5FF" />

  <!-- Center Enterprise Core Node -->
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="10" fill="#602BF7" />

  <!-- Connecting Speed Ray -->
  <line x1="160" y1="176" x2="256" y2="256" stroke="#00E5FF" stroke-width="4" stroke-dasharray="6,4" opacity="0.8" />
  <line x1="256" y1="256" x2="340" y2="396" stroke="#00E5FF" stroke-width="4" stroke-dasharray="6,4" opacity="0.8" />
</svg>
